<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QYH-GD300 故障定位系统 v0.1</title>
<style>
  :root {
    --bg-app: #12161F;
    --bg-panel: #1A2030;
    --border: #2C3549;
    --text-primary: #E8ECF4;
    --text-secondary: #8A94A8;
    --accent: #2E7CF6;
    --status-normal: #22C55E;
    --status-alarm: #EF4444;
    --offline: #6B7280;
    --mono: "Cascadia Mono", "Consolas", "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg-app);
    color: var(--text-primary);
    font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    overflow: hidden;
  }
  .app { display: flex; flex-direction: column; height: 100vh; padding: 14px; gap: 12px; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 16px; flex: 0 0 auto;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .title { font-size: 15px; font-weight: 600; }
  .brand .ver { color: var(--text-secondary); font-family: var(--mono); font-size: 12px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .conn { display: flex; align-items: center; gap: 10px; }
  .badge {
    font-family: var(--mono); font-size: 12px; padding: 3px 10px;
    border-radius: 999px; border: 1px solid currentColor;
  }
  .badge.searching { color: var(--accent); }
  .badge.locked { color: var(--status-normal); }
  .badge.offline { color: var(--offline); }
  .port { font-family: var(--mono); font-size: 15px; font-weight: 600; min-width: 5ch; }
  .tag {
    font-family: var(--mono); font-size: 11px; color: var(--text-secondary);
    border: 1px dashed var(--border); border-radius: 4px; padding: 2px 8px;
  }
  .tag.mock { color: var(--status-normal); border-color: var(--status-normal); }
  .hidden { display: none !important; }

  /* ---------- 统计卡 ---------- */
  .stats {
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 12px; flex: 0 0 auto;
  }
  .stat {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; min-width: 0;
  }
  .stat label { display: block; color: var(--text-secondary); font-size: 12px; margin-bottom: 6px; }
  .stat b {
    font-family: var(--mono); font-size: 20px; font-weight: 600;
    display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stat b.small { font-size: 15px; }
  .stat b.dim { color: var(--text-secondary); }

  /* ---------- 数据面板 ---------- */
  .panel {
    flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .panel-head .caption { color: var(--text-secondary); }
  .actions { display: flex; gap: 8px; }
  button {
    background: transparent; color: var(--text-primary); cursor: pointer;
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 14px; font-size: 12px; font-family: inherit;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.active { border-color: var(--status-alarm); color: var(--status-alarm); }

  .hex {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 10px 14px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
    white-space: pre;
  }
  .row { display: flex; gap: 14px; }
  .row .off { color: var(--text-secondary); width: 8ch; flex: 0 0 auto; }
  .row .hexs { color: var(--text-primary); width: 47ch; flex: 0 0 auto; }
  .row .asc { color: var(--status-normal); width: 18ch; flex: 0 0 auto; }
  .row .asc.mono { color: var(--status-normal); }
  .empty { color: var(--text-secondary); }
  .hex::-webkit-scrollbar { width: 10px; }
  .hex::-webkit-scrollbar-track { background: var(--bg-app); }
  .hex::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

  /* ---------- 结构化采样帧 ---------- */
  .frames-panel { min-height: 0; }
  .frames-wrap { flex: 1 1 auto; min-height: 0; overflow: auto; }
  .frames-wrap table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12px; }
  .frames-wrap th, .frames-wrap td {
    padding: 3px 10px; text-align: left; white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }
  .frames-wrap th {
    position: sticky; top: 0; background: var(--bg-panel);
    color: var(--text-secondary); font-weight: 500;
  }
  .frames-wrap .empty { padding: 8px 10px; }
  .proto-stats { font-family: var(--mono); font-size: 12px; color: var(--text-secondary); }
  .frames-wrap::-webkit-scrollbar { width: 10px; height: 10px; }
  .frames-wrap::-webkit-scrollbar-track { background: var(--bg-app); }
  .frames-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }

  /* ---------- 事件条 ---------- */
  .events {
    flex: 0 0 auto; background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px; height: 74px; overflow: hidden;
    font-family: var(--mono); font-size: 12px; color: var(--text-secondary);
  }
  .events div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .events .t { color: var(--text-secondary); margin-right: 8px; }

  /* ---------- 设置弹窗 ---------- */
  .mask {
    position: fixed; inset: 0; background: rgba(6, 9, 14, .66);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  .dialog {
    width: 440px; background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .dialog-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 600;
  }
  .field-label { display: block; color: var(--text-secondary); font-size: 12px; margin-bottom: 6px; }
  .dialog input[type="text"], .dialog input[type="number"] {
    width: 100%; background: var(--bg-app); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    font-family: inherit; font-size: 13px;
  }
  .dialog select {
    width: 100%; background: var(--bg-app); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
    font-family: inherit; font-size: 13px;
  }
  .field-row { display: flex; gap: 8px; align-items: flex-start; }
  .field-row .grow { flex: 1 1 0; min-width: 0; }
  .field-note { color: var(--text-secondary); font-size: 12px; margin-top: 6px; }
  .layout-custom { display: flex; flex-direction: column; gap: 8px; }
  .dialog input[type="text"]:focus, .dialog input[type="number"]:focus,
  .dialog select:focus { outline: none; border-color: var(--accent); }
  .hint { color: var(--text-secondary); font-size: 12px; margin-top: 6px; }
  .hint.ok { color: var(--status-normal); }
  .hint.error { color: var(--status-alarm); }
  .dialog-foot { display: flex; gap: 8px; }
  #btnResetName { margin-right: auto; }
  .dialog-sep { height: 1px; background: var(--border); margin: 2px 0; }
  button.primary { border-color: var(--accent); color: var(--accent); }

  /* ---------- 主区两栏 / 下区两栏（第二批重排） ---------- */
  .mid { flex: 1 1 auto; min-height: 0; display: flex; gap: 12px; }
  .mid > .panel { flex: 1 1 0; min-width: 0; }
  .lower { flex: 0 0 auto; height: 196px; display: flex; gap: 12px; }
  .lower > .panel { min-width: 0; }
  .frames-panel { flex: 2 1 0; }
  .alarm-panel { flex: 1 1 0; }
  .curve-panel { flex: 1.2 1 0 !important; }

  /* ---------- 曲线面板 ---------- */
  .curve-wrap { position: relative; flex: 1 1 auto; min-height: 0; padding: 6px 8px 0; }
  #curveCanvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
  .curve-tip {
    position: absolute; z-index: 5; pointer-events: none;
    background: rgba(12, 16, 24, .95); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 9px; font-family: var(--mono);
    font-size: 11.5px; line-height: 1.55; white-space: nowrap;
  }
  .curve-tip .k { color: var(--text-secondary); }
  .curve-legend {
    display: flex; flex-wrap: wrap; gap: 3px 14px; padding: 4px 12px 2px;
    font-family: var(--mono); font-size: 11.5px; color: var(--text-secondary);
  }
  .curve-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .curve-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .curve-tools {
    display: flex; align-items: center; gap: 8px; padding: 2px 12px 8px;
  }
  .curve-tools input[type="range"] { flex: 1 1 auto; accent-color: var(--accent); min-width: 60px; }
  .curve-tools .win { font-family: var(--mono); font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; }

  /* ---------- 报警列表 ---------- */
  .alarm-wrap { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 4px 10px; }
  .alarm-item {
    display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--border);
    font-family: var(--mono); font-size: 11.5px;
  }
  .alarm-item .t { color: var(--text-secondary); flex: 0 0 auto; }
  .alarm-item .msg { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .alarm-item.active .msg { color: var(--status-alarm); }
  .alarm-item.clear .msg { color: var(--status-normal); }
  .alarm-empty { color: var(--text-secondary); padding: 6px 0; }
  .alarm-wrap::-webkit-scrollbar { width: 10px; }
  .alarm-wrap::-webkit-scrollbar-track { background: var(--bg-app); }
  .alarm-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  .badge-alarm { color: var(--status-alarm); border-color: var(--status-alarm); }
  .badge-alarm.blink { animation: blip 1s steps(2, start) infinite; }
  @keyframes blip { 50% { opacity: .35; } }
  tr.hit td { background: rgba(46, 124, 246, .22); }
  td.alarm-cell { color: var(--status-alarm); }

  /* ---------- 手动下行 ---------- */
  .send-panel { flex: 0 0 auto; }
  .send-body { display: flex; align-items: center; gap: 8px; padding: 10px 14px; flex-wrap: wrap; }
  .send-body select, .send-body input[type="text"] {
    background: var(--bg-app); color: var(--text-primary); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-family: var(--mono); font-size: 12.5px;
  }
  .send-body input[type="text"] { flex: 1 1 260px; min-width: 140px; }
  .send-body input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .send-body label { color: var(--text-secondary); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
  .send-log {
    padding: 0 14px 10px; font-family: var(--mono); font-size: 11.5px;
    color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .send-log .tx { color: var(--accent); }

  /* ---------- 字段表编辑器 ---------- */
  .dialog.wide { width: 960px; max-width: 96vw; }
  .field-table-wrap {
    max-height: 46vh; overflow: auto;
    border: 1px solid var(--border); border-radius: 6px;
  }
  .field-table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .field-table th, .field-table td {
    padding: 4px 6px; text-align: left; white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }
  .field-table th {
    position: sticky; top: 0; background: var(--bg-panel);
    color: var(--text-secondary); font-weight: 500;
  }
  .field-table input[type="text"], .field-table input[type="number"] {
    width: 100%; min-width: 48px; background: var(--bg-app); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 6px; font-family: inherit; font-size: 12px;
  }
  .field-table .c-id, .field-table .c-name { min-width: 84px; }
  .field-table input[type="color"] {
    width: 34px; height: 24px; padding: 0;
    border: 1px solid var(--border); background: var(--bg-app);
  }
  .field-table .c-del { padding: 3px 8px; font-size: 11px; }
  .field-table-wrap::-webkit-scrollbar { width: 10px; height: 10px; }
  .field-table-wrap::-webkit-scrollbar-track { background: var(--bg-app); }
  .field-table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="title" id="appTitle">QYH-GD300 故障定位系统</span>
      <span class="ver" id="appVersion">v0.1</span>
    </div>
    <div class="topbar-right">
      <div class="conn">
        <span id="tagMock" class="tag mock hidden">模拟数据源</span>
        <span id="tagAlarm" class="tag badge-alarm hidden">报警</span>
        <span id="tagScan" class="tag hidden"></span>
        <span id="badge" class="badge offline">未连接</span>
        <span id="portName" class="port">--</span>
      </div>
      <button id="btnSettings">设置</button>
    </div>
  </header>

  <section class="stats">
    <div class="stat"><label>累计字节</label><b id="sTotal">0</b></div>
    <div class="stat"><label>当前速率 (B/s)</label><b id="sRate">0.0</b></div>
    <div class="stat"><label>本窗口字节</label><b id="sWindow">0</b></div>
    <div class="stat"><label>疑似帧头</label><b id="sHead" class="dim small">--</b></div>
    <div class="stat"><label>疑似帧长 (字节)</label><b id="sLen" class="dim small">--</b></div>
    <div class="stat"><label>高频 2 字节组合</label><b id="sPairs" class="dim small">--</b></div>
  </section>

  <div class="mid">
    <section class="panel">
      <div class="panel-head">
        <span class="caption">原始数据流（HEX / ASCII 原始字节）</span>
        <div class="actions">
          <button id="btnPause">暂停</button>
          <button id="btnClear">清屏</button>
        </div>
      </div>
      <div id="hexPane" class="hex"><div class="empty">等待数据……</div></div>
    </section>

    <section class="panel curve-panel">
      <div class="panel-head">
        <span class="caption">曲线 <span id="curveTag" class="tag">单 Y 轴</span></span>
        <div class="actions">
          <button id="btnCurvePause">暂停</button>
          <button id="btnCurvePng">导出 PNG</button>
          <button id="btnCurveCsv">导出 CSV</button>
          <button id="btnAlarmCsv">报警 CSV</button>
        </div>
      </div>
      <div class="curve-wrap">
        <canvas id="curveCanvas"></canvas>
        <div id="curveTip" class="curve-tip hidden"></div>
      </div>
      <div class="curve-tools">
        <button id="btnCurveFit">自适应 Y</button>
        <input id="curveSlider" type="range" min="0" max="1000" value="1000" class="hidden" />
        <span id="curveWin" class="win"></span>
      </div>
      <div id="curveLegend" class="curve-legend"></div>
    </section>
  </div>

  <div class="lower">
    <section class="panel frames-panel">
      <div class="panel-head">
        <span class="caption">结构化采样帧 <span id="protoLayout" class="tag"></span></span>
        <span id="protoStats" class="proto-stats"></span>
      </div>
      <div id="framesWrap" class="frames-wrap">
        <table>
          <thead><tr id="frameHead"></tr></thead>
          <tbody id="frameBody"><tr><td class="empty">等待帧……</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="panel alarm-panel">
      <div class="panel-head">
        <span class="caption">报警 <span id="alarmStats" class="proto-stats"></span></span>
        <div class="actions">
          <button id="btnAlarmMute">静音</button>
          <button id="btnAlarmClearList">清空</button>
        </div>
      </div>
      <div id="alarmWrap" class="alarm-wrap"><div class="alarm-empty">暂无报警</div></div>
    </section>
  </div>

  <section class="panel send-panel">
    <div class="panel-head">
      <span class="caption">手动下行 <span id="sendState" class="tag">未锁定</span>
        <span class="proto-stats">（仅锁定后开放，扫描期只读不写）</span></span>
    </div>
    <div class="send-body">
      <select id="selSendMode">
        <option value="text">文本</option>
        <option value="hex">HEX</option>
      </select>
      <input id="inpSendData" type="text" autocomplete="off"
             placeholder="文本内容，或 HEX 字节（如 AA 55 01）" />
      <label id="chkNewlineWrap"><input id="chkSendNewline" type="checkbox" checked /> 追加换行</label>
      <button id="btnSend" class="primary" disabled>发送</button>
      <span id="sendHint" class="hint grow"></span>
    </div>
    <div id="sendLog" class="send-log">下行记录：—</div>
  </section>

  <footer id="evtLog" class="events"></footer>
</div>

<div id="settingsMask" class="mask hidden">
  <div class="dialog">
    <div class="dialog-head">
      <span>设置</span>
      <button id="btnCloseSettings">关闭</button>
    </div>
    <div>
      <label class="field-label" for="inpAppName">系统名称</label>
      <input id="inpAppName" type="text" maxlength="32" autocomplete="off"
             placeholder="QYH-GD300 故障定位系统" />
      <div id="nameHint" class="hint">最多 32 个字符，保存后立即生效并写入本地配置</div>
    </div>
    <div class="dialog-foot">
      <button id="btnResetName">恢复默认</button>
      <button id="btnSaveName" class="primary">保存</button>
    </div>

    <div class="dialog-sep"></div>
    <div>
      <label class="field-label" for="selScheme">方案（帧格式 + 字段表）</label>
      <div class="field-row">
        <div class="grow"><select id="selScheme"></select></div>
        <button id="btnEditFields">编辑字段表…</button>
      </div>
      <div id="schemeHint" class="hint"></div>
    </div>
  </div>
</div>

<div id="fieldMask" class="mask hidden">
  <div class="dialog wide">
    <div class="dialog-head">
      <span>字段表编辑</span>
      <button id="btnCloseFields">关闭</button>
    </div>

    <div class="field-row">
      <div class="grow">
        <label class="field-label" for="inpSchemeName">方案名（内置方案请改名后另存）</label>
        <input id="inpSchemeName" type="text" maxlength="32" autocomplete="off" />
      </div>
      <div class="grow">
        <label class="field-label" for="inpSchemeKind">链路类型</label>
        <input id="inpSchemeKind" type="text" readonly />
      </div>
    </div>

    <div id="frameBox" class="layout-custom">
      <div class="field-row">
        <div class="grow">
          <label class="field-label" for="selLayoutBase">帧基准</label>
          <select id="selLayoutBase">
            <option value="25">25 字节</option>
            <option value="14">14 字节</option>
          </select>
        </div>
        <div class="grow">
          <label class="field-label" for="inpFrameLen">帧长（字节）</label>
          <input id="inpFrameLen" type="number" min="4" max="4096" step="1" />
        </div>
        <div class="grow">
          <label class="field-label" for="inpCrcOffset">CRC 偏移</label>
          <input id="inpCrcOffset" type="number" min="2" max="4094" step="1" />
        </div>
        <div class="grow">
          <label class="field-label" for="inpCrcCovers">CRC 覆盖</label>
          <input id="inpCrcCovers" type="number" min="1" max="4094" step="1" />
        </div>
        <div class="grow">
          <label class="field-label" for="selCrcOrder">CRC 字节序</label>
          <select id="selCrcOrder">
            <option value="little">低字节在前</option>
            <option value="big">高字节在前</option>
          </select>
        </div>
        <div class="grow">
          <label class="field-label" for="selByteOrder">字段字节序</label>
          <select id="selByteOrder">
            <option value="big">大端</option>
            <option value="little">小端</option>
          </select>
        </div>
      </div>
    </div>

    <div class="field-table-wrap">
      <table class="field-table">
        <thead>
          <tr>
            <th>字段 ID</th><th>显示名</th><th>单位</th><th>小数</th>
            <th>k</th><th>b</th><th>取值来源</th><th>键名 / 偏移</th>
            <th>原始类型</th><th>进表</th><th>进曲线</th><th>颜色</th><th></th>
          </tr>
        </thead>
        <tbody id="fieldBody"></tbody>
      </table>
    </div>

    <div class="dialog-foot">
      <button id="btnAddField">添加字段</button>
      <span id="fieldHint" class="hint grow"></span>
      <button id="btnSaveFields" class="primary">保存并启用</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var MAX_ROWS = 500;
  var ROW_BYTES = 16;
  var MAX_FRAMES = 200;

  var pane = document.getElementById("hexPane");
  var evtLog = document.getElementById("evtLog");
  var badge = document.getElementById("badge");
  var portName = document.getElementById("portName");
  var tagScan = document.getElementById("tagScan");
  var tagMock = document.getElementById("tagMock");
  var btnPause = document.getElementById("btnPause");
  var btnClear = document.getElementById("btnClear");
  var appTitle = document.getElementById("appTitle");
  var appVersion = document.getElementById("appVersion");

  var APP_VERSION = "v0.1";
  var DEFAULT_APP_NAME = "QYH-GD300 故障定位系统";
  var MAX_APP_NAME = 32;
  var currentName = DEFAULT_APP_NAME;

  var buf = new Uint8Array(0);   // 尚未成行的尾部字节
  var rowOffset = 0;             // buf[0] 在全局字节流中的绝对偏移
  var dirty = false;
  var paused = false;
  var hasRows = false;

  /* ---------------- 渲染 ---------------- */
  function hex2(n) { return (n < 16 ? "0" : "") + n.toString(16).toUpperCase(); }

  function render() {
    var rows = Math.floor(buf.length / ROW_BYTES);
    if (rows <= 0) return;

    if (!hasRows) { pane.innerHTML = ""; hasRows = true; }

    var frag = document.createDocumentFragment();
    var parts, i, b;

    for (var r = 0; r < rows; r++) {
      parts = [];
      var asc = "";
      for (i = 0; i < ROW_BYTES; i++) {
        b = buf[r * ROW_BYTES + i];
        parts.push(hex2(b));
        asc += (b >= 32 && b < 127) ? String.fromCharCode(b) : ".";
      }
      var row = document.createElement("div");
      row.className = "row";

      var off = document.createElement("span");
      off.className = "off";
      off.textContent = ("00000000" + (rowOffset + r * ROW_BYTES).toString(16).toUpperCase())
        .slice(-8);
      row.appendChild(off);

      var hexs = document.createElement("span");
      hexs.className = "hexs";
      hexs.textContent = parts.join(" ");
      row.appendChild(hexs);

      var ascEl = document.createElement("span");
      ascEl.className = "asc";
      ascEl.textContent = "|" + asc + "|";
      row.appendChild(ascEl);

      frag.appendChild(row);
    }

    pane.appendChild(frag);
    buf = buf.slice(rows * ROW_BYTES);
    rowOffset += rows * ROW_BYTES;

    while (pane.childElementCount > MAX_ROWS) pane.removeChild(pane.firstChild);
    var nearBottom = pane.scrollHeight - pane.scrollTop - pane.clientHeight < 120;
    if (nearBottom) pane.scrollTop = pane.scrollHeight;
  }

  function tick() {
    if (dirty && !paused) { dirty = false; render(); }
    if (curveDirty) { curveDirty = false; drawCurve(); }
    requestAnimationFrame(tick);
  }

  /* ---------------- 数据接入 ---------------- */
  function appendHex(hexStr) {
    if (paused || !hexStr) return;
    var n = hexStr.length >> 1;
    var chunk = new Uint8Array(n);
    for (var i = 0; i < n; i++) chunk[i] = parseInt(hexStr.substr(i * 2, 2), 16);
    var merged = new Uint8Array(buf.length + n);
    merged.set(buf, 0);
    merged.set(chunk, buf.length);
    buf = merged;
    dirty = true;
  }

  /* ---------------- 状态刷新 ---------------- */
  function fmt(n) { return (n || 0).toLocaleString("en-US"); }

  function updateStatus(s) {
    if (s.mock) tagMock.classList.remove("hidden");
    lockState = s.state;
    updateSendState();

    if (s.state === "locked") {
      badge.className = "badge locked";
      badge.textContent = "已锁定";
      portName.textContent = s.port || "--";
      tagScan.classList.add("hidden");
    } else {
      badge.className = "badge searching";
      badge.textContent = "搜索中";
      portName.textContent = "--";
      if (s.scan) {
        tagScan.classList.remove("hidden");
        tagScan.textContent = "扫描 " + s.scan.index + "/" + s.scan.total + " : " + s.scan.port;
      } else {
        tagScan.classList.remove("hidden");
        tagScan.textContent = "无可用串口";
      }
    }

    document.getElementById("sTotal").textContent = fmt(s.total_bytes);
    document.getElementById("sRate").textContent = (s.rate || 0).toFixed(1);
    document.getElementById("sWindow").textContent = fmt(s.window_bytes);

    setField("sHead", s.frame_head || "--");
    setField("sLen", s.frame_len != null ? String(s.frame_len) : "--");

    var pairs = (s.top_pairs || []).slice(0, 2)
      .map(function (p) { return p.pair + "×" + p.count; }).join("  ");
    setField("sPairs", pairs || "--");
  }

  function setField(id, text) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.className = (text === "--") ? "dim small" : "small";
  }

  function pushEvent(text) {
    var line = document.createElement("div");
    var t = new Date().toLocaleTimeString("zh-CN", { hour12: false });
    line.innerHTML = '<span class="t">' + t + "</span>";
    line.appendChild(document.createTextNode(text));
    evtLog.appendChild(line);
    while (evtLog.childElementCount > 4) evtLog.removeChild(evtLog.firstChild);
  }

  /* ---------------- 交互 ---------------- */
  btnPause.addEventListener("click", function () {
    paused = !paused;
    btnPause.textContent = paused ? "继续" : "暂停";
    btnPause.classList.toggle("active", paused);
  });

  btnClear.addEventListener("click", function () {
    pane.innerHTML = "";
    hasRows = true;
    resetFrameTable();
  });

  /* ---------------- 结构化采样帧 ---------------- */
  var frameCount = 0;
  var frameCols = "";
  var frameRevKey = null;    // 链路+布局+版本号：任一变化都说明表格口径变了，旧行必须清掉

  function setColumns(cols) {
    if (!cols || !cols.length) return;
    var key = cols.join("|");
    if (key === frameCols) return;          // 列名不变就别重建表头（含列数相同的换布局）
    frameCols = key;
    frameHead.innerHTML = "";
    cols.forEach(function (c) {
      var th = document.createElement("th");
      th.textContent = c;
      frameHead.appendChild(th);
    });
    resetFrameTable();                      // 字段表变了，旧行口径已失效 → 清表
  }

  function resetFrameTable() {
    frameBody.innerHTML = '<tr><td class="empty">等待帧……</td></tr>';
    frameCount = 0;
  }

  function updateProtoStats(s) {
    if (!s) return;
    var key = (s.kind || "") + "|" + (s.layout || "") + "|" + (s.scheme || "") + "|" + s.rev;
    if (frameRevKey !== null && key !== frameRevKey) resetFrameTable();
    frameRevKey = key;
    protoLayout.textContent = s.scheme || s.layout_title || ("布局 " + s.layout);
    if (s.kind === "text") {
      // 文本链路没有 CRC / 重同步概念：统计条按"行"的口径显示
      protoStats.textContent = "有效行 " + fmt(s.frames_ok) + " ｜ 无效行 " + fmt(s.crc_err)
        + " ｜ 丢弃字节 " + fmt(s.bytes_dropped) + " ｜ 待切 " + (s.pending || 0);
    } else {
      protoStats.textContent = "有效帧 " + fmt(s.frames_ok) + " ｜ CRC 错 " + fmt(s.crc_err)
        + " ｜ 重同步 " + fmt(s.resync) + " ｜ 丢弃字节 " + fmt(s.bytes_dropped)
        + " ｜ 待切 " + (s.pending || 0);
    }
    setColumns(s.columns);
  }

  function appendFrames(items) {
    if (!items || !items.length) return;
    if (!frameCount) frameBody.innerHTML = "";

    // 表格列序 = 接收时刻 + 进表字段（与 analyzer.columns() 同序）
    var tableFields = curve.fields.filter(function (f) { return f.visible && f.visible.table; });
    var nearBottom = framesWrap.scrollHeight - framesWrap.scrollTop - framesWrap.clientHeight < 40;
    var frag = document.createDocumentFragment();
    items.forEach(function (f) {
      var tr = document.createElement("tr");
      if (f.ts != null) tr.dataset.ts = f.ts;
      var flds = f.fields || null;                  // 首屏 /api/protocol 的 recent 无分析结果
      (f.cells || []).forEach(function (v, ci) {
        var td = document.createElement("td");
        td.textContent = v;
        var spec = ci > 0 ? tableFields[ci - 1] : null;
        if (spec && hasAlarm(spec)) td.classList.add("alarm-cell");
        if (spec && flds && flds[spec.id] && flds[spec.id].alarm) td.classList.add("cell-alarm");
        tr.appendChild(td);
      });
      frag.appendChild(tr);
      frameCount++;
      if (flds && f.ts != null) {                    // 喂曲线：只取滤波后的工程量
        var rec = { ts: f.ts, v: {} };
        for (var fid in flds) {
          var val = flds[fid].value;
          if (typeof val === "number" && isFinite(val)) rec.v[fid] = val;
        }
        pushSample(rec);
      }
    });
    frameBody.appendChild(frag);
    while (frameBody.childElementCount > MAX_FRAMES) frameBody.removeChild(frameBody.firstChild);
    if (nearBottom) framesWrap.scrollTop = framesWrap.scrollHeight;
    if (frag.childElementCount) curveDirty = true;
  }

  function loadProtocol() {
    fetch("/api/protocol").then(function (r) { return r.json(); })
      .then(function (s) {
        updateProtoStats(s);
        appendFrames(s.recent);
      })
      .catch(function () {});
  }

  /* ---------------- 系统名称 / 设置 ---------------- */
  function applyAppName(name) {
    currentName = name;
    appTitle.textContent = name;
    appVersion.textContent = APP_VERSION;
    document.title = name + " " + APP_VERSION;
    syncWindowTitle(name);
  }

  // 桌面端（pywebview）把名称同步到原生窗口标题栏；浏览器里无此接口，直接跳过
  function syncWindowTitle(name) {
    try {
      var api = window.pywebview && window.pywebview.api;
      if (api && api.set_app_title) api.set_app_title(name);
    } catch (e) { /* 浏览器环境，忽略 */ }
  }

  // pywebview 的 api 在页面加载后才注入，ready 时补一次同步
  window.addEventListener("pywebviewready", function () { syncWindowTitle(currentName); });

  function setHint(text, kind) {
    nameHint.textContent = text;
    nameHint.className = "hint" + (kind ? " " + kind : "");
  }

  function openSettings() {
    inpAppName.value = currentName;
    setHint("最多 " + MAX_APP_NAME + " 个字符，保存后立即生效并写入本地配置", "");
    loadSchemes();
    settingsMask.classList.remove("hidden");
    inpAppName.focus();
    inpAppName.select();
  }

  function closeSettings() { settingsMask.classList.add("hidden"); }

  btnSettings.addEventListener("click", openSettings);
  btnCloseSettings.addEventListener("click", closeSettings);
  settingsMask.addEventListener("click", function (e) {
    if (e.target === settingsMask) closeSettings();      // 点击遮罩关闭
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !settingsMask.classList.contains("hidden")) closeSettings();
  });

  btnResetName.addEventListener("click", function () {
    inpAppName.value = DEFAULT_APP_NAME;
    setHint("已填入默认名称，点“保存”后生效", "");
  });

  btnSaveName.addEventListener("click", function () {
    btnSaveName.disabled = true;
    fetch("/api/settings", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ app_name: inpAppName.value })
    }).then(function (r) { return r.json(); })
      .then(function (body) {
        if (!body.ok) { setHint(body.error || "保存失败", "error"); return; }
        applyAppName(body.app_name);
        inpAppName.value = body.app_name;
        setHint("已保存，界面与窗口标题栏已同步", "ok");
        pushEvent("系统名称已改为「" + body.app_name + "」");
        setTimeout(closeSettings, 700);
      })
      .catch(function () { setHint("保存失败：本地服务不可用", "error"); })
      .then(function () { btnSaveName.disabled = false; });
  });

  /* ---------------- 方案（帧格式 + 字段表） ---------------- */
  var schemeList = [];
  var activeScheme = null;      // 当前激活方案的完整对象（含 fields）

  function schemeSummary(s) {
    if (!s) return "";
    var f = s.frame || {};
    if (f.kind === "text") return "ASCII 文本行 · " + (s.fields || []).length + " 个字段";
    var c = f.custom || {};
    return "二进制定长帧 " + c.frame_len + " 字节 · CRC 偏移 " + c.crc_offset
      + " · " + (s.fields || []).length + " 个字段";
  }

  function setSchemeHint(text, kind) {
    schemeHint.textContent = text;
    schemeHint.className = "hint" + (kind ? " " + kind : "");
  }

  function buildSchemeSelect(active) {
    selScheme.innerHTML = "";
    schemeList.forEach(function (s) {
      var opt = document.createElement("option");
      opt.value = s.name;
      opt.textContent = s.name + (s.builtin ? "（内置）" : "")
        + " · " + (s.kind === "text" ? "文本行" : s.mode) + " · " + s.fields + " 字段";
      selScheme.appendChild(opt);
    });
    if (active) selScheme.value = active;
  }

  function loadSchemes() {
    return fetch("/api/schemes").then(function (r) { return r.json(); })
      .then(function (body) {
        schemeList = body.items || [];
        buildSchemeSelect(body.active);
        if (!schemeList.length) { setSchemeHint("没有可用方案", "error"); return; }
        return loadScheme(body.active || selScheme.value);
      })
      .catch(function () { setSchemeHint("读取方案失败：本地服务不可用", "error"); });
  }

  function loadScheme(name) {
    if (!name) return Promise.resolve();
    return fetch("/api/schemes/" + encodeURIComponent(name))
      .then(function (r) { return r.json(); })
      .then(function (body) {
        if (!body.ok) { setSchemeHint(body.error || "读取方案失败", "error"); return; }
        activeScheme = body.scheme;
        setSchemeHint("当前： " + schemeSummary(activeScheme), "");
        setCurveConfig(activeScheme);       // 曲线窗口/抽稀策略随方案走
        loadFields();                        // 字段表变了：图例、进曲线可见性、报警标色都跟着换
      })
      .catch(function () {});
  }

  selScheme.addEventListener("change", function () {
    var name = selScheme.value;
    setSchemeHint("正在切换…", "");
    fetch("/api/schemes/" + encodeURIComponent(name) + "/activate", { method: "POST" })
      .then(function (r) { return r.json(); })
      .then(function (body) {
        if (!body.ok) { setSchemeHint(body.error || "切换失败", "error"); return; }
        activeScheme = body.scheme;
        setSchemeHint("已启用： " + schemeSummary(activeScheme), "ok");
        curve.buf = []; curve.cursor = null;      // 旧口径的采样点对新字段无意义
        alarmLog = []; alarmActive = {};
        renderAlarmList(); updateAlarmBanner();
        setCurveConfig(activeScheme);
        loadFields();
        curveDirty = true;
      })
      .catch(function () { setSchemeHint("切换失败：本地服务不可用", "error"); });
  });

  /* ---------------- 字段表编辑器 ---------------- */
  var fieldRowSeq = 0;

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  function setFieldHint(text, kind) {
    fieldHint.textContent = text;
    fieldHint.className = "hint grow" + (kind ? " " + kind : "");
  }

  function addFieldRow(f) {
    f = f || {};
    var src = f.source || { type: "key", key: "F" };
    var scale = f.scale || { k: 1, b: 0 };
    var vis = f.visible || { table: true, curve: true };
    var seq = ++fieldRowSeq;
    var tr = document.createElement("tr");
    tr.innerHTML =
      '<td><input class="c-id" type="text" value="' + esc(f.id || ("f" + seq)) + '"></td>' +
      '<td><input class="c-name" type="text" value="' + esc(f.name || "") + '"></td>' +
      '<td><input class="c-unit" type="text" value="' + esc(f.unit || "") + '"></td>' +
      '<td><input class="c-dec" type="number" min="0" max="6" step="1" value="'
        + (f.decimals != null ? f.decimals : 0) + '"></td>' +
      '<td><input class="c-k" type="number" step="any" value="'
        + (scale.k != null ? scale.k : 1) + '"></td>' +
      '<td><input class="c-b" type="number" step="any" value="'
        + (scale.b != null ? scale.b : 0) + '"></td>' +
      '<td><select class="c-src"><option value="key">文本键</option>'
        + '<option value="offset">二进制偏移</option></select></td>' +
      '<td><input class="c-srcval" type="text" value="'
        + esc(src.type === "offset" ? (src.offset || 0) : (src.key || "F")) + '"></td>' +
      '<td><input class="c-rawq" type="text" value="' + esc(src.raw_type || "u16") + '"></td>' +
      '<td><input class="c-tab" type="checkbox"' + (vis.table ? " checked" : "") + '></td>' +
      '<td><input class="c-cur" type="checkbox"' + (vis.curve ? " checked" : "") + '></td>' +
      '<td><input class="c-color" type="color" value="' + esc(f.color || "#2E7CF6") + '"></td>' +
      '<td><button class="c-del">删除</button></td>';
    tr._orig = f;                                  // 保留原始 filter/alarm，避免被清掉
    fieldBody.appendChild(tr);
    tr.querySelector(".c-src").value = (src.type === "offset") ? "offset" : "key";
    tr.querySelector(".c-del").addEventListener("click", function () { tr.remove(); });
  }

  function num(el, fallback) {
    var v = parseFloat(el.value);
    return isNaN(v) ? fallback : v;
  }

  function collectFields() {
    var out = [];
    Array.prototype.forEach.call(fieldBody.querySelectorAll("tr"), function (tr) {
      var q = function (cls) { return tr.querySelector(cls); };
      var srcType = q(".c-src").value;
      var raw = q(".c-srcval").value.trim();
      var source = (srcType === "offset")
        ? { type: "offset", offset: parseInt(raw, 10) || 0,
            raw_type: q(".c-rawq").value.trim() || "u16", byte_order: selByteOrder.value }
        : { type: "key", key: raw || "F" };
      out.push({
        id: q(".c-id").value.trim(),
        name: q(".c-name").value.trim(),
        unit: q(".c-unit").value.trim(),
        decimals: parseInt(q(".c-dec").value, 10) || 0,
        scale: { k: num(q(".c-k"), 1), b: num(q(".c-b"), 0) },
        filter: (tr._orig && tr._orig.filter) || { type: "none", window: 5, alpha: 0.2 },
        alarm: (tr._orig && tr._orig.alarm)
          || { high: { enabled: false, limit: 0, hysteresis: 0, debounce_s: 1 },
               low: { enabled: false, limit: 0, hysteresis: 0, debounce_s: 1 } },
        color: q(".c-color").value,
        visible: { table: q(".c-tab").checked, curve: q(".c-cur").checked },
        source: source
      });
    });
    return out;
  }

  function openFieldEditor() {
    if (!activeScheme) { loadSchemes().then(openFieldEditor); return; }
    var frame = activeScheme.frame || {};
    var c = frame.custom || {};
    inpSchemeName.value = activeScheme.builtin
      ? (activeScheme.name + " 副本") : activeScheme.name;
    inpSchemeKind.value = (frame.kind === "text") ? "ASCII 文本行" : "二进制定长帧";
    selLayoutBase.value = frame.base || "25";
    inpFrameLen.value = c.frame_len != null ? c.frame_len : "";
    inpCrcOffset.value = c.crc_offset != null ? c.crc_offset : "";
    inpCrcCovers.value = c.covers != null ? c.covers : "";
    selCrcOrder.value = c.crc_order || "little";
    selByteOrder.value = c.byte_order || "big";
    frameBox.classList.toggle("hidden", frame.kind === "text");
    fieldBody.innerHTML = "";
    (activeScheme.fields || []).forEach(addFieldRow);
    if (!fieldBody.childElementCount) addFieldRow(null);
    setFieldHint("", "");
    fieldMask.classList.remove("hidden");
  }

  function closeFieldEditor() { fieldMask.classList.add("hidden"); }

  function saveFields() {
    if (!activeScheme) return;
    var name = inpSchemeName.value.trim();
    if (!name) { setFieldHint("请填写方案名", "error"); return; }
    var frame = JSON.parse(JSON.stringify(activeScheme.frame || {}));
    frame.base = selLayoutBase.value;
    frame.custom = {
      frame_len: parseInt(inpFrameLen.value, 10) || (frame.custom && frame.custom.frame_len),
      crc_offset: parseInt(inpCrcOffset.value, 10) || (frame.custom && frame.custom.crc_offset),
      covers: parseInt(inpCrcCovers.value, 10) || (frame.custom && frame.custom.covers),
      crc_order: selCrcOrder.value,
      byte_order: selByteOrder.value
    };
    var payload = {
      name: name, builtin: false, version: activeScheme.version || 1,
      frame: frame, fields: collectFields(),
      curve: activeScheme.curve || { window_s: 60, max_points: 20000, decimate: "minmax" },
      storage: activeScheme.storage || { mode: "session", flush_ms: 500 }
    };
    btnSaveFields.disabled = true;
    fetch("/api/schemes", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); })
      .then(function (body) {
        if (!body.ok) { setFieldHint(body.error || "保存失败", "error"); return; }
        return fetch("/api/schemes/" + encodeURIComponent(body.scheme.name) + "/activate",
                     { method: "POST" })
          .then(function (r) { return r.json(); })
          .then(function (act) {
            if (!act.ok) { setFieldHint(act.error || "启用失败", "error"); return; }
            activeScheme = act.scheme;
            setFieldHint("已保存并启用：" + act.scheme.name, "ok");
            loadSchemes();
            setTimeout(closeFieldEditor, 700);
          });
      })
      .catch(function () { setFieldHint("保存失败：本地服务不可用", "error"); })
      .then(function () { btnSaveFields.disabled = false; });
  }

  btnEditFields.addEventListener("click", openFieldEditor);
  btnCloseFields.addEventListener("click", closeFieldEditor);
  btnAddField.addEventListener("click", function () { addFieldRow(null); });
  btnSaveFields.addEventListener("click", saveFields);
  fieldMask.addEventListener("click", function (e) {
    if (e.target === fieldMask) closeFieldEditor();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !fieldMask.classList.contains("hidden")) closeFieldEditor();
  });

  function loadSettings() {
    fetch("/api/settings").then(function (r) { return r.json(); })
      .then(function (s) {
        if (s.version) APP_VERSION = s.version;
        if (s.default_name) DEFAULT_APP_NAME = s.default_name;
        if (s.max_len) { MAX_APP_NAME = s.max_len; inpAppName.maxLength = s.max_len; }
        applyAppName(s.app_name || DEFAULT_APP_NAME);
      })
      .catch(function () { applyAppName(DEFAULT_APP_NAME); })
      .then(function () { loadSchemes(); });
  }

  /* ================= 第二批：曲线 / 报警 / 手动下行 ================= */
  var curveCanvas = document.getElementById("curveCanvas");
  var curveTip = document.getElementById("curveTip");
  var curveLegend = document.getElementById("curveLegend");
  var curveSlider = document.getElementById("curveSlider");
  var curveWinEl = document.getElementById("curveWin");
  var curveTag = document.getElementById("curveTag");
  var btnCurvePause = document.getElementById("btnCurvePause");
  var btnCurveFit = document.getElementById("btnCurveFit");
  var btnCurvePng = document.getElementById("btnCurvePng");
  var btnCurveCsv = document.getElementById("btnCurveCsv");
  var btnAlarmCsv = document.getElementById("btnAlarmCsv");
  var alarmWrap = document.getElementById("alarmWrap");
  var alarmStats = document.getElementById("alarmStats");
  var tagAlarm = document.getElementById("tagAlarm");
  var btnAlarmMute = document.getElementById("btnAlarmMute");
  var btnAlarmClearList = document.getElementById("btnAlarmClearList");
  var btnSend = document.getElementById("btnSend");
  var selSendMode = document.getElementById("selSendMode");
  var inpSendData = document.getElementById("inpSendData");
  var chkSendNewline = document.getElementById("chkSendNewline");
  var chkNewlineWrap = document.getElementById("chkNewlineWrap");
  var sendHint = document.getElementById("sendHint");
  var sendState = document.getElementById("sendState");
  var sendLog = document.getElementById("sendLog");

  var curveDirty = true;
  var curve = {
    buf: [],            // [{ts, v:{字段id:值}}]，按时间升序
    fields: [],         // 当前方案字段（含颜色 / 可见性 / 小数位）
    maxPoints: 20000,
    windowS: 60,
    decimate: "minmax",
    paused: false,
    fit: true,
    frozen: null,
    yMin: 0, yMax: 1,
    cursor: null,
    geo: null           // 最近一次绘制的几何信息（悬停/点击换算用）
  };

  /* ---------------- 工具 ---------------- */
  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function timeStr(ts) {
    var d = new Date(ts * 1000);
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds())
      + "." + String(Math.floor(d.getMilliseconds() / 10) + 100).slice(1);
  }

  function stamp() {
    var d = new Date();
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "_"
      + pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
  }

  function fmtVal(v, dec) {
    if (typeof v !== "number" || !isFinite(v)) return "—";
    return v.toFixed(Math.max(0, Math.min(6, dec | 0)));
  }

  function downloadBlob(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }

  function fetchCsv(url, name) {
    fetch(url).then(function (r) { return r.blob(); })
      .then(function (b) { downloadBlob(b, name); pushEvent("已导出 " + name); })
      .catch(function () { pushEvent("导出失败：本地服务不可用"); });
  }

  function pushSample(rec) {
    curve.buf.push(rec);
    if (curve.buf.length > curve.maxPoints) {
      curve.buf.splice(0, curve.buf.length - curve.maxPoints);   // 超限丢最旧
    }
  }

  function nearestIndex(ts) {
    var b = curve.buf, lo = 0, hi = b.length - 1;
    if (!b.length) return -1;
    while (lo < hi) {
      var mid = (lo + hi) >> 1;
      if (b[mid].ts < ts) lo = mid + 1; else hi = mid;
    }
    if (lo > 0 && Math.abs(b[lo - 1].ts - ts) < Math.abs(b[lo].ts - ts)) return lo - 1;
    return lo;
  }

  function visibleFields() {
    return curve.fields.filter(function (f) { return f.visible && f.visible.curve; });
  }

  function hasAlarm(spec) {
    var a = (spec && spec.alarm) || {};
    return !!((a.high && a.high.enabled) || (a.low && a.low.enabled));
  }

  function setCurveConfig(scheme) {
    var c = (scheme && scheme.curve) || {};
    curve.windowS = c.window_s || 60;
    curve.maxPoints = c.max_points || 20000;
    curve.decimate = c.decimate || "minmax";
    curveTag.textContent = "窗 " + curve.windowS + "s · "
      + (curve.decimate === "minmax" ? "minmax 抽稀" : "不抽稀");
  }

  function loadFields() {
    return fetch("/api/fields").then(function (r) { return r.json(); })
      .then(function (b) {
        curve.fields = b.fields || [];
        renderLegend();
        curveDirty = true;
      })
      .catch(function () {});
  }

  function renderLegend() {
    var vis = visibleFields();
    if (!vis.length) {
      curveLegend.innerHTML = '<span>无可绘制字段（在字段表里勾选“进曲线”）</span>';
      return;
    }
    var html = "";
    vis.forEach(function (f) {
      html += '<span><i style="background:' + esc(f.color || "#2E7CF6") + '"></i>'
        + esc(f.name || f.id) + (f.unit ? " (" + esc(f.unit) + ")" : "") + "</span>";
    });
    curveLegend.innerHTML = html;
  }

  /* ---------------- 视图窗口（实时 / 暂停回看） ---------------- */
  function bufBounds() {
    var b = curve.buf;
    return b.length ? [b[0].ts, b[b.length - 1].ts] : null;
  }

  function currentView() {
    var bnd = bufBounds();
    if (!bnd) return null;
    if (!curve.paused) return [bnd[1] - curve.windowS, bnd[1]];
    var span = bnd[1] - bnd[0];
    var win = Math.min(curve.windowS, Math.max(span, 1));
    var endMin = bnd[0] + win, endMax = bnd[1];
    if (endMax <= endMin) return [bnd[0], bnd[1]];
    var frac = (parseFloat(curveSlider.value) || 0) / 1000;
    var t1 = endMin + frac * (endMax - endMin);
    return [t1 - win, t1];
  }

  function updateWinLabel() {
    var v = currentView();
    curveWinEl.textContent = v
      ? (curve.paused ? "回看 " : "实时 ") + timeStr(v[0]) + " → " + timeStr(v[1])
      : "等待数据";
  }

  /* ---------------- 绘制 ---------------- */
  function fitCanvas() {
    var dpr = window.devicePixelRatio || 1;
    var w = curveCanvas.clientWidth, h = curveCanvas.clientHeight;
    if (w <= 0 || h <= 0) return false;
    var W = Math.round(w * dpr), H = Math.round(h * dpr);
    if (curveCanvas.width !== W) curveCanvas.width = W;
    if (curveCanvas.height !== H) curveCanvas.height = H;
    return true;
  }

  function drawCurve() {
    updateWinLabel();
    if (!fitCanvas()) return;
    var ctx = curveCanvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, curveCanvas.width, curveCanvas.height);
    ctx.scale(dpr, dpr);
    var w = curveCanvas.clientWidth, h = curveCanvas.clientHeight;

    var padL = 50, padR = 10, padT = 10, padB = 22;
    var pw = w - padL - padR, ph = h - padT - padB;
    if (pw < 20 || ph < 20) return;

    ctx.font = "11px Consolas, 'Cascadia Mono', monospace";
    ctx.textBaseline = "middle";

    var view = currentView();
    var vis = visibleFields();
    if (!view || !vis.length) {
      curve.geo = null;
      ctx.fillStyle = "#8A94A8";
      ctx.textAlign = "center";
      ctx.fillText("等待采样数据…（字段表里勾选“进曲线”）", padL + pw / 2, padT + ph / 2);
      return;
    }

    var t0 = view[0], t1 = view[1];
    if (t1 <= t0) t1 = t0 + 1;

    // 收集窗口内的点 + Y 范围
    var series = {}, yMin = Infinity, yMax = -Infinity;
    vis.forEach(function (f) {
      var pts = [];
      for (var i = 0; i < curve.buf.length; i++) {
        var r = curve.buf[i];
        if (r.ts < t0 || r.ts > t1) continue;
        var v = r.v[f.id];
        if (typeof v === "number" && isFinite(v)) {
          pts.push([r.ts, v]);
          if (v < yMin) yMin = v;
          if (v > yMax) yMax = v;
        }
      }
      series[f.id] = pts;
    });
    if (!isFinite(yMin)) { yMin = 0; yMax = 1; }
    if (curve.fit) {
      if (yMax === yMin) { yMin -= 1; yMax += 1; }
      var margin = (yMax - yMin) * 0.06;
      yMin -= margin; yMax += margin;
      curve.yMin = yMin; curve.yMax = yMax;
    } else if (curve.frozen) {
      yMin = curve.frozen[0]; yMax = curve.frozen[1];
    }
    curve.yMin = yMin; curve.yMax = yMax;

    function px(t) { return padL + (t - t0) / (t1 - t0) * pw; }
    function py(v) { return padT + (1 - (v - yMin) / (yMax - yMin)) * ph; }
    curve.geo = { padL: padL, padT: padT, pw: pw, ph: ph, t0: t0, t1: t1 };

    // 横向网格 + Y 轴刻度
    ctx.textAlign = "right";
    for (var k = 0; k <= 4; k++) {
      var vv = yMin + (yMax - yMin) * k / 4;
      var yy = py(vv);
      ctx.strokeStyle = "#2C3549";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(padL + pw, yy); ctx.stroke();
      ctx.fillStyle = "#8A94A8";
      ctx.fillText(vv.toFixed(Math.abs(yMax - yMin) < 10 ? 2 : 0), padL - 6, yy);
    }
    // 纵向网格 + 时间刻度
    ctx.textAlign = "center";
    for (var j = 0; j <= 5; j++) {
      var tt = t0 + (t1 - t0) * j / 5;
      var xx = px(tt);
      ctx.strokeStyle = "rgba(44,53,73,.55)";
      ctx.beginPath(); ctx.moveTo(xx, padT); ctx.lineTo(xx, padT + ph); ctx.stroke();
      ctx.fillStyle = "#8A94A8";
      ctx.fillText(timeStr(tt).slice(0, 8), xx, padT + ph + 11);
    }

    // 各通道（单 Y 轴叠加）
    var maxCols = Math.max(20, Math.floor(pw));
    vis.forEach(function (f) {
      var pts = series[f.id];
      if (!pts || !pts.length) return;
      ctx.strokeStyle = f.color || "#2E7CF6";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      if (curve.decimate === "minmax" && pts.length > maxCols * 2) {
        var cols = {};
        for (var i = 0; i < pts.length; i++) {
          var x = Math.round(px(pts[i][0]) - padL);
          var v = pts[i][1], c = cols[x];
          if (!c) cols[x] = [v, v]; else { if (v < c[0]) c[0] = v; if (v > c[1]) c[1] = v; }
        }
        var xs = Object.keys(cols).map(Number).sort(function (a, b) { return a - b; });
        var first = true;
        xs.forEach(function (col) {
          var c = cols[col], X = padL + col;
          if (first) { ctx.moveTo(X, py(c[0])); first = false; }
          else { ctx.lineTo(X, py(c[0])); }
          ctx.lineTo(X, py(c[1]));
        });
      } else {
        for (var n = 0; n < pts.length; n++) {
          var X = px(pts[n][0]), Y = py(pts[n][1]);
          if (n === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
        }
      }
      ctx.stroke();
    });

    // 悬停十字线 + 各通道取值点
    if (curve.cursor && curve.cursor.ts >= t0 && curve.cursor.ts <= t1) {
      var idx = nearestIndex(curve.cursor.ts);
      var cx = px(curve.cursor.ts);
      ctx.strokeStyle = "rgba(232,236,244,.5)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx, padT); ctx.lineTo(cx, padT + ph); ctx.stroke();
      if (idx >= 0) {
        var rec = curve.buf[idx];
        vis.forEach(function (f) {
          var v = rec.v[f.id];
          if (typeof v === "number" && isFinite(v)) {
            ctx.fillStyle = f.color || "#2E7CF6";
            ctx.beginPath(); ctx.arc(cx, py(v), 2.8, 0, 6.2832); ctx.fill();
          }
        });
      }
    }
  }

  function updateTip(ts) {
    var idx = nearestIndex(ts);
    if (idx < 0) return;
    var rec = curve.buf[idx];
    var vis = visibleFields();
    var html = '<div><span class="k">' + timeStr(rec.ts) + "</span></div>";
    vis.forEach(function (f) {
      var v = rec.v[f.id];
      html += '<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;'
        + "margin-right:5px;background:" + esc(f.color || "#2E7CF6") + '"></i>'
        + esc(f.name || f.id) + " <span class=\"k\">"
        + fmtVal(v, f.decimals || 0) + (f.unit ? " " + esc(f.unit) : "") + "</span></div>";
    });
    curveTip.innerHTML = html;
    curveTip.classList.remove("hidden");
    var g = curve.geo, x = g ? g.padL + (ts - g.t0) / (g.t1 - g.t0) * g.pw : 0;
    var left = x + 14;
    if (left + curveTip.offsetWidth > curveCanvas.clientWidth) left = x - curveTip.offsetWidth - 14;
    curveTip.style.left = Math.max(2, left) + "px";
    curveTip.style.top = "10px";
  }

  function locateTableRow(ts) {
    var rows = frameBody.querySelectorAll("tr");
    var best = null, bestDiff = Infinity;
    Array.prototype.forEach.call(rows, function (tr) {
      var t = parseFloat(tr.dataset.ts);
      if (isNaN(t)) return;
      var d = Math.abs(t - ts);
      if (d < bestDiff) { bestDiff = d; best = tr; }
    });
    Array.prototype.forEach.call(rows, function (tr) { tr.classList.remove("hit"); });
    if (!best) {
      pushEvent("该时刻不在表格缓冲内（表格仅保留最近 " + MAX_FRAMES + " 帧）");
      return;
    }
    best.classList.add("hit");
    if (best.scrollIntoView) best.scrollIntoView({ block: "center" });
    pushEvent("已定位到表格行：" + timeStr(parseFloat(best.dataset.ts)));
  }

  /* ---------------- 曲线交互 ---------------- */
  curveCanvas.addEventListener("mousemove", function (e) {
    var g = curve.geo;
    if (!g) return;
    var rect = curveCanvas.getBoundingClientRect();
    var x = e.clientX - rect.left;
    if (x < g.padL || x > g.padL + g.pw) {
      curve.cursor = null; curveTip.classList.add("hidden"); curveDirty = true; return;
    }
    var ts = g.t0 + (x - g.padL) / g.pw * (g.t1 - g.t0);
    curve.cursor = { ts: ts };
    updateTip(ts);
    curveDirty = true;
  });

  curveCanvas.addEventListener("mouseleave", function () {
    curve.cursor = null; curveTip.classList.add("hidden"); curveDirty = true;
  });

  curveCanvas.addEventListener("click", function (e) {
    var g = curve.geo;
    if (!g) return;
    var rect = curveCanvas.getBoundingClientRect();
    var x = e.clientX - rect.left;
    if (x < g.padL || x > g.padL + g.pw) return;
    locateTableRow(g.t0 + (x - g.padL) / g.pw * (g.t1 - g.t0));
  });

  btnCurveFit.addEventListener("click", function () {
    curve.fit = !curve.fit;
    btnCurveFit.classList.toggle("active", !curve.fit);
    btnCurveFit.textContent = curve.fit ? "自适应 Y" : "锁定 Y";
    if (!curve.fit) curve.frozen = [curve.yMin, curve.yMax];
    curveDirty = true;
  });

  btnCurvePause.addEventListener("click", function () {
    curve.paused = !curve.paused;
    btnCurvePause.textContent = curve.paused ? "继续" : "暂停";
    btnCurvePause.classList.toggle("active", curve.paused);
    curveSlider.classList.toggle("hidden", !curve.paused);
    if (curve.paused) { curveSlider.value = 1000; loadHistory(); }
    curveDirty = true;
  });

  curveSlider.addEventListener("input", function () { curveDirty = true; });

  btnCurvePng.addEventListener("click", function () {
    drawCurve();
    curveCanvas.toBlob(function (blob) {
      if (!blob) { pushEvent("导出 PNG 失败"); return; }
      downloadBlob(blob, "curve_" + stamp() + ".png");
      pushEvent("已导出曲线 PNG");
    }, "image/png");
  });

  btnCurveCsv.addEventListener("click", function () {
    fetchCsv("/api/export/samples.csv", "samples_" + stamp() + ".csv");
  });
  btnAlarmCsv.addEventListener("click", function () {
    fetchCsv("/api/export/alarms.csv", "alarms_" + stamp() + ".csv");
  });

  function loadHistory() {
    return fetch("/api/store?limit=200000").then(function (r) { return r.json(); })
      .then(function (b) {
        var items = b.items || [];
        if (!items.length) return;
        var byTs = {};
        items.forEach(function (it) { (byTs[it.ts] = byTs[it.ts] || {})[it.field] = it.value; });
        var have = {};
        curve.buf.forEach(function (rec) { have[rec.ts] = true; });
        var added = 0;
        Object.keys(byTs).forEach(function (k) {
          var ts = parseFloat(k);
          if (have[ts]) return;
          curve.buf.push({ ts: ts, v: byTs[k] });
          added++;
        });
        curve.buf.sort(function (a, b) { return a.ts - b.ts; });
        if (curve.buf.length > curve.maxPoints) {
          curve.buf.splice(0, curve.buf.length - curve.maxPoints);
        }
        if (added) pushEvent("已从会话库回填 " + added + " 条历史采样");
        curveDirty = true;
      })
      .catch(function () {});
  }

  window.addEventListener("resize", function () { curveDirty = true; });

  /* ---------------- 报警 ---------------- */
  var alarmLog = [];        // 升序
  var alarmActive = {};     // 当前处于报警的字段
  var alarmMuted = false;

  function addAlarmItems(items) {
    (items || []).forEach(function (a) {
      if (a.active) alarmActive[a.field] = true; else delete alarmActive[a.field];
      alarmLog.push(a);
    });
    if (alarmLog.length > 300) alarmLog.splice(0, alarmLog.length - 300);
    renderAlarmList();
    updateAlarmBanner();
  }

  function renderAlarmList() {
    if (!alarmLog.length) {
      alarmWrap.innerHTML = '<div class="alarm-empty">暂无报警</div>';
      return;
    }
    var frag = document.createDocumentFragment();
    var start = Math.max(0, alarmLog.length - 200);
    for (var i = alarmLog.length - 1; i >= start; i--) {
      var a = alarmLog[i];
      var div = document.createElement("div");
      div.className = "alarm-item " + (a.active ? "active" : "clear");
      var t = document.createElement("span"); t.className = "t";
      t.textContent = a.ts_text || timeStr(a.ts);
      var m = document.createElement("span"); m.className = "msg";
      m.textContent = a.text || "";
      div.appendChild(t); div.appendChild(m);
      frag.appendChild(div);
    }
    alarmWrap.innerHTML = "";
    alarmWrap.appendChild(frag);
  }

  function updateAlarmBanner() {
    var n = Object.keys(alarmActive).length;
    if (n > 0) {
      tagAlarm.classList.remove("hidden");
      tagAlarm.textContent = "报警 ×" + n;
      tagAlarm.classList.toggle("blink", !alarmMuted);
    } else {
      tagAlarm.classList.add("hidden");
      tagAlarm.classList.remove("blink");
    }
    alarmStats.textContent = n > 0 ? ("当前 " + n + " 项") : "";
  }

  btnAlarmMute.addEventListener("click", function () {
    alarmMuted = !alarmMuted;
    btnAlarmMute.textContent = alarmMuted ? "取消静音" : "静音";
    btnAlarmMute.classList.toggle("active", alarmMuted);
    updateAlarmBanner();
    pushEvent(alarmMuted ? "报警提示已静音（记录仍保留）" : "报警提示已恢复");
  });

  btnAlarmClearList.addEventListener("click", function () {
    alarmLog = []; alarmActive = {};
    renderAlarmList(); updateAlarmBanner();
    pushEvent("报警列表已清空（会话库记录仍在，可导出）");
  });

  function loadAlarms() {
    return fetch("/api/alarms?limit=200").then(function (r) { return r.json(); })
      .then(function (b) {
        var items = b.items || [];
        alarmActive = {};
        var seen = {};
        items.forEach(function (a) {                      // 倒序：每字段看最新一条
          if (seen[a.field]) return;
          seen[a.field] = true;
          if (a.active) alarmActive[a.field] = true;
        });
        alarmLog = items.slice().reverse();               // 转成升序，便于后续追加
        renderAlarmList(); updateAlarmBanner();
      })
      .catch(function () {});
  }

  /* ---------------- 手动下行 ---------------- */
  var lockState = "searching";

  function updateSendState() {
    var locked = (lockState === "locked");
    btnSend.disabled = !locked;
    sendState.textContent = locked ? "已锁定" : "未锁定";
    sendState.className = "tag" + (locked ? " mock" : "");
  }

  function setSendHint(text, kind) {
    sendHint.textContent = text;
    sendHint.className = "hint grow" + (kind ? " " + kind : "");
  }

  function logSend(m) {
    sendLog.innerHTML = '<span class="tx">下行 ' + m.n + " 字节 → " + esc(m.port || "-")
      + "</span>  " + esc(m.hex || "");
    pushEvent("已下行 " + m.n + " 字节：" + (m.hex || ""));
  }

  selSendMode.addEventListener("change", function () {
    var isHex = selSendMode.value === "hex";
    chkNewlineWrap.style.display = isHex ? "none" : "";
    inpSendData.placeholder = isHex ? "HEX 字节（如 AA 55 01）" : "文本内容";
  });

  inpSendData.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !btnSend.disabled) btnSend.click();
  });

  btnSend.addEventListener("click", function () {
    var data = inpSendData.value;
    if (!data) { setSendHint("请输入要发送的内容", "error"); return; }
    setSendHint("发送中…", "");
    fetch("/api/send", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mode: selSendMode.value, data: data,
        append_newline: chkSendNewline.checked
      })
    }).then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
      .then(function (res) {
        if (!res.body.ok) { setSendHint(res.body.error || "发送失败", "error"); return; }
        setSendHint("已发送 " + res.body.bytes + " 字节", "ok");
        inpSendData.value = "";
      })
      .catch(function () { setSendHint("发送失败：本地服务不可用", "error"); });
  });

  /* ---------------- 连接 ---------------- */
  function connect() {
    var ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://")
      + location.host + "/ws");

    ws.onopen = function () { pushEvent("已连接到本地服务"); };

    ws.onmessage = function (ev) {
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === "data") appendHex(m.hex);
      else if (m.type === "status") updateStatus(m);
      else if (m.type === "frames") { appendFrames(m.items); updateProtoStats(m.stats); }
      else if (m.type === "layout") { updateProtoStats(m.stats); pushEvent(m.text); }
      else if (m.type === "alarm") addAlarmItems(m.items);
      else if (m.type === "send") logSend(m);
      else if (m.type === "event") pushEvent(m.text);
    };

    ws.onclose = function () {
      badge.className = "badge offline";
      badge.textContent = "未连接";
      pushEvent("与服务断开，正在重连…");
      setTimeout(connect, 1000);
    };
  }

  fetch("/api/status").then(function (r) { return r.json(); })
    .then(updateStatus).catch(function () {});
  loadSettings();
  loadProtocol();
  loadAlarms();
  loadFields();
  updateSendState();
  updateWinLabel();
  connect();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
